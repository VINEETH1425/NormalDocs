server:
  port: ${GATEWAY_PORT}

spring:
  application:
    name: api-gateway

  config:
    import: optional:file:.env[.properties]

eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL}

jwt:
  secret: ${JWT_SECRET}
