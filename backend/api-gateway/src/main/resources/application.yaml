server:
  port: ${GATEWAY_PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: api-gateway

  config:
    import: optional:file:.env[.properties]

eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

