server:
  port: ${EUREKA_PORT}

spring:
  application:
    name: eureka-server

  config:
    import: optional:file:.env[.properties]

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false

  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_URL}
