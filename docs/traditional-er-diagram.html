<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traditional ER Diagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            color: #000000;
            overflow: auto;
        }
        .diagram-container {
            width: 100%;
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            background: #ffffff;
        }
        .diagram-image {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            cursor: zoom-in;
            user-select: none;
            -webkit-user-drag: none;
        }
        .diagram-image.zoomed {
            max-width: none;
            width: 4000px;
            cursor: zoom-out;
        }
        @media print {
            @page {
                size: landscape;
                margin: 0;
            }
            body {
                background: #ffffff;
            }
            .diagram-image {
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
            }
        }
    </style>
</head>
<body>

<div class="diagram-container">
    <img id="erImg" class="diagram-image" src="StoreConnect_Traditional_ER_Diagram.png" alt="Traditional ER Diagram" onclick="toggleZoom()" title="Click to toggle 100% zoom">
</div>

<script>
    const img = document.getElementById('erImg');
    function toggleZoom() {
        img.classList.toggle('zoomed');
    }
</script>

</body>
</html>
